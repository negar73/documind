# DocuMind database — PostgreSQL 16 with the pgvector extension preinstalled.
# Start it with:  docker compose up -d
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: documind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: documind
    ports:
      - "5432:5432"
    volumes:
      # Persist index data across container restarts.
      - documind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d documind"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  documind_pgdata:
